[package]
name = "omablock-engine"
version = "1.0.0"
edition = "2021"
authors = ["Ozan Özdil <ozan@pm.me>"]
description = "Machine-Age Zero-Latency AdBlocker & Tracker Shield for Omarchy Linux"
license = "MIT"

[lib]
name = "omablock_engine"
path = "src/lib.rs"

[[bin]]
name = "omablock-engine"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
