<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 14px;
      font-family: "JetBrainsMono Nerd Font", monospace, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 8px;
    }
    .title {
      font-weight: bold;
      font-size: 13px;
      color: #22c55e;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      font-size: 10px;
      color: #94a3b8;
    }
    .site-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .site-label {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .site-domain {
      font-size: 13px;
      font-weight: bold;
      color: #f8fafc;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      margin-top: 8px;
    }
    .status-badge {
      font-weight: bold;
      color: #22c55e;
    }
    .status-badge.whitelisted {
      color: #f59e0b;
    }
    button {
      width: 100%;
      padding: 8px 10px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      color: #f8fafc;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover {
      background: #1e293b;
      border-color: #64748b;
    }
    .footer {
      font-size: 10px;
      color: #64748b;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">OmaBlock Bridge</span>
    <span class="badge" id="versionBadge">v1.0.3</span>
  </div>

  <div class="site-card">
    <div class="site-label">Aktif Sayfa:</div>
    <div class="site-domain" id="activeDomain">Bilinmiyor</div>
    <div class="status-row">
      <span>Kalkan Durumu:</span>
      <span class="status-badge" id="statusBadge">Korumada</span>
    </div>
  </div>

  <button id="toggleBtn">Bu Sitede Kalkanı Kapat</button>

  <div class="footer">Omarchy Zero-Latency Defense</div>

  <script src="popup.js"></script>
</body>
</html>
