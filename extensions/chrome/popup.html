<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      margin: 0;
      padding: 14px;
      font-family: "JetBrainsMono Nerd Font", monospace, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .title {
      font-weight: bold;
      font-size: 14px;
      color: #22c55e;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      font-size: 11px;
      color: #94a3b8;
    }
    .status {
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 8px;
      line-height: 1.4;
    }
    .protected {
      color: #22c55e;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">OmaBlock Shield</span>
    <span class="badge">Hybrid</span>
  </div>
  <div class="status">
    Durum: <span class="protected">Aktif</span><br>
    Katman: Sistem + Tarayici DOM
  </div>
</body>
</html>
